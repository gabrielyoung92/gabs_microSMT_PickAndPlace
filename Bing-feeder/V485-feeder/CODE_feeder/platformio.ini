; MicroSMT-derived V485 firmware, with Gab's local addressed RS485 bootloader.
; Wiring/timing/version: src/config.h. Installation/protocol: BOOTLOADER.md.
; Build does not upload. Initial loader installation uses ST-Link; subsequent
; application uploads use the ESP32-C3 bridge or auto-direction USB-RS485 adapter,
; with an explicit destination feeder ID.

[platformio]
default_envs = v485

[env]
; Official packages, pinned after checking on 20 October 2026.
platform = platformio/ststm32@20.0.0
; HAL/CMSIS only; CubeIDE/CubeMX and generated projects are not required.
framework = stm32cube
platform_packages =
    platformio/framework-stm32cubef1@1.8.7
    ; Explicit GCC 14.2.1 instead of the platform's older default compiler.
    platformio/toolchain-gccarmnoneeabi@1.140201.0
; MCU profile only: verify actual STM32F103C8 / 64 KB flash / 20 KB RAM.
board = bluepill_f103c8
build_flags =
    ; Assumed physical crystal: board.c sets HSE -> PLL x9 -> 72 MHz.
    -DHSE_VALUE=8000000U
    --specs=nosys.specs
build_src_flags =
    ; Warnings apply to our C sources, not the downloaded ST framework.
    -std=gnu11
    -Wall
    -Wextra
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_eol = LF

[application]
; The first 8 KB belongs to the loader; application vectors start at 0x08002000.
; These defines MUST apply to ST's SystemInit as well as our application.
board_build.ldscript = stm32f103c8.ld
board_upload.maximum_size = 57344
build_flags =
    ${env.build_flags}
    -DUSER_VECT_TAB_ADDRESS
    -DVECT_TAB_OFFSET=0x2000U
build_src_filter = +<*> -<bootloader.c>
; Upload always selects a destination; never broadcast firmware writes.
; Replace REQUIRED with this feeder's EEPROM ID (0..99) before pressing Upload.
; Select upload_port in VS Code or pass --upload-port COM5 to pio.
custom_feeder_address = REQUIRED
upload_protocol = custom
upload_command = "$PYTHONEXE" tools/rs485_upload.py --port "$UPLOAD_PORT" --address ${this.custom_feeder_address} --firmware "$BUILD_DIR/${PROGNAME}.bin"

[bootloader]
; Installed once over SWD at 0x08000000; build and upload are separate tasks.
board_build.ldscript = bootloader.ld
board_upload.maximum_size = 8192
; Link-time optimisation keeps shared HAL drivers inside the 8 KB loader.
build_flags = ${env.build_flags} -flto
build_src_filter = +<*> -<main.c> -<feeder.c>
build_src_flags =
    ${env.build_src_flags}
    -DFEEDER_BOOTLOADER=1

[env:v485]
extends = application

[env:bootloader]
extends = bootloader
