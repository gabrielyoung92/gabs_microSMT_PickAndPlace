; MicroSMT V485 ESP32-C3 RS485 feeder controller.
; PlatformIO compiles src/main.cpp, which includes src/config.h for GPIOs,
; version, serial speeds, LED timing and input/acknowledgement timeouts.

; Build environment name shown in VS Code's PlatformIO Project Tasks.
; Command-line build: pio run -e esp32c3
[env:esp32c3]

; Pin the ESP32 platform version used for the verified build.
; This selects the compiler/framework package requirements; update deliberately.
platform = platformio/espressif32@7.1.3

; Use the ESP32-C3 profile with 4 MB flash and a 160 MHz CPU.
; The supplied photo shows a Super Mini, so this is a compatible build profile,
; not an assertion that the module is a physical DevKitM-1.
; Confirm the actual module's flash size before uploading.
board = esp32-c3-devkitm-1

; Keep Arduino APIs such as setup(), loop(), digitalWrite() and HardwareSerial
; available while building ordinary C++ source from src/main.cpp.
framework = arduino

; Apply these USB options to both our source and the Arduino framework.
; USB_MODE=1 selects the chip's hardware USB Serial/JTAG interface.
; USB_CDC_ON_BOOT=1 makes Serial use USB for commands and diagnostic output.
; Both are needed here: UART0 is already used by Serial485 on GPIO20/21.
; Disabling USB CDC would put Serial on UART0 and conflict with RS485 traffic.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Serial Monitor console setting, matching USB_BAUD in src/config.h.
; This is separate from RS485_BAUD=115200, which controls the feeder bus.
monitor_speed = 115200

; Send a newline when Enter is pressed in Serial Monitor.
; main.cpp collects bounded complete lines; LF completes the line.
monitor_eol = LF
