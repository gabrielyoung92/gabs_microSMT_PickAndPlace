[platformio]
default_envs = feeder_f103_bench, bridge_pico2
src_dir = firmware

[env]
monitor_speed = 115200
build_flags =
    -Ifirmware/common
    -Ifirmware/feeder
    -Ifirmware/bridge
    -Wall
    -Wextra

[env:feeder_f103_bench]
platform = platformio/ststm32@20.0.0
board = bing_feeder_f103_candidate
framework = cmsis
build_src_filter = +<common/*.c> +<feeder/feed_cycle.c> +<feeder/node.c> +<feeder/stm32/*.c>
build_flags = ${env.build_flags} -DFEEDER_ADDRESS=1
upload_protocol = stlink

[pico_bridge]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
framework = picosdk
build_src_filter = +<common/*.c> +<bridge/*.c> +<bridge/pico/*.c>
build_flags = ${env.build_flags} -DPIO_STDIO_USB -DPICO_STDIO_USB_ENABLE_RESET_VIA_BAUD_RATE=0 -DPICO_STDIO_USB_ENABLE_RESET_VIA_VENDOR_INTERFACE=0

[env:bridge_pico2]
extends = pico_bridge
board = rpipico2

[env:bridge_pico2w]
extends = pico_bridge
board = rpipico2w
build_flags = ${pico_bridge.build_flags} -DBRIDGE_WIFI -I.local

[env:native]
platform = platformio/native@1.2.1
build_src_filter = +<common/*.c> +<feeder/feed_cycle.c> +<feeder/node.c> +<bridge/*.c> +<native/*.c>
build_flags = ${env.build_flags} -std=c11 -Werror -Wpedantic -Wconversion -Wshadow
